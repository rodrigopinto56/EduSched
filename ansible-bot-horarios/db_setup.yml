---
- name: Crear usuario y base de datos para bot de horarios
  hosts: bot_horarios
  become: yes

  vars:
    db_name: horarios_db
    db_user: horarios_user
    db_password: "horarios_db2025Tecmi" 

  tasks:
    - name: Verificar si el usuario ya existe
      become_user: postgres
      ansible.builtin.command: >
        psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_user }}';"
      register: user_exists
      changed_when: false

    - name: Crear usuario si no existe
      become_user: postgres
      ansible.builtin.command: >
        psql -c "CREATE USER {{ db_user }} WITH PASSWORD '{{ db_password }}';"
      when: user_exists.stdout.find('1') == -1

    - name: Verificar si la base de datos ya existe
      become_user: postgres
      ansible.builtin.command: >
        psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}';"
      register: db_exists
      changed_when: false

    - name: Crear base de datos si no existe
      become_user: postgres
      ansible.builtin.command: >
        psql -c "CREATE DATABASE {{ db_name }} OWNER {{ db_user }};"
      when: db_exists.stdout.find('1') == -1
